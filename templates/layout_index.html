{% load static %}

{% include "includes/origin.html" %}

{% block bodytag %}
<body>
<div id="fb-root"></div>
{% endblock %}
<div id="wrap-block">
<div id="wrap">
	<div class="logo"><a href="#"><img src="{% static 'images/scubamob-logo.png' %}" width="100" alt="ScubaMob Logo" border="0" /></a></div>
	<div class="header-block">
        <form method="post" action="{ url 'django.contrib.auth.views.login' %}">
        {% csrf_token %}
    	<div class="header-login">
            <div style="padding-top:10px;padding-bottom:10px;">
                <table width="100%" border="0" cellpadding="0" cellspacing="0">
                  <tr>
                      <td width="155" align="right">
                          <a href="{% url 'login' %}"><img src="{% static 'images/scubamob-login-button.png' %}" /></a>&nbsp;
                          <a href="{% url 'register' %}"><img src="{% static 'images/scubamob-signup-top.png' %}" /></a>
                      </td>
                  </tr>
                </table>
            </div>
        </div>
        </form>
    </div>

    {% block content %}
        <div class="right-block">
        </div>
    {% endblock %}

</div>
</div>
</body>
</html>
