{% extends 'layout.html' %}
{% load static compress %}

{% block leftmenu %}{% endblock %}

{% block includes %}
<script src="{% static 'js/messenger.js' %}"></script>
{% endblock %}

{% block content %}
<style>

body{
    background:#eee;
}
.row.row-broken {
    padding-bottom: 0;
}
.col-inside-lg {
    padding: 20px;
    height:calc(100vh - 395px);
}
.chat {
    height: calc(100vh - 265px);
}
.decor-default {
    background-color: #ffffff;
}
.chat-users h6 {
    font-size: 20px;
    margin: 0 0 20px;
}
.chat-users .user {
    position: relative;
    padding: 0 0 0 50px;
    display: block;
    cursor: pointer;
    margin: 0 0 20px;
}
.chat-users .user .avatar {
    top: 0;
    left: 0;
}
.chat .avatar {
    width: 40px;
    height: 40px;
    position: absolute;
}
.chat .avatar img {
    display: block;
    border-radius: 20px;
    height: 100%;
}
.chat .avatar .status.off {
    border: 1px solid #5a5a5a;
    background: #ffffff;
}
.chat .avatar .status.online {
    background: #4caf50;
}
.chat .avatar .status.busy {
    background: #ffc107;
}
.chat .avatar .status.offline {
    background: #ed4e6e;
}
.chat-users .user .status {
    bottom: 0;
    left: 28px;
}
.chat .avatar .status {
    width: 10px;
    height: 10px;
    border-radius: 5px;
    position: absolute;
}
.chat-users .user .name {
    font-size: 14px;
    font-weight: bold;
    line-height: 20px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.chat-users .user .mood {
    font: 200 14px/20px "Raleway", sans-serif;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/*****************CHAT BODY *******************/
.chat-body h6 {
    font-size: 20px;
    margin: 0 0 20px;
    float:left;
}
.chat-body button {
    float:right;
}
.chat-body .answer.left {
    padding: 0 0 0 58px;
    text-align: left;
    float: left;
}
.chat-body .answer {
    position: relative;
    max-width: 600px;
    overflow: hidden;
    clear: both;
}
.chat-body .answer.left .avatar {
    left: 0;
}
.chat-body .answer .avatar {
    bottom: 36px;
}
.chat .avatar {
    width: 40px;
    height: 40px;
    position: absolute;
}
.chat .avatar img {
    display: block;
    border-radius: 20px;
    height: 100%;
}
.chat-body .answer .name {
    font-size: 14px;
    line-height: 36px;
}
.chat-body .answer.left .avatar .status {
    right: 4px;
}
.chat-body .answer .avatar .status {
    bottom: 0;
}
.chat-body .answer.left .text {
    background: #ebebeb;
    color: #333333;
    border-radius: 8px 8px 8px 0;
}
.chat-body .answer .text {
    padding: 12px;
    font-size: 16px;
    line-height: 26px;
    position: relative;
}
.chat-body .answer.left .text:before {
    left: -30px;
    border-right-color: #ebebeb;
    border-right-width: 12px;
}
.chat-body .answer .text:before {
    content: '';
    display: block;
    position: absolute;
    bottom: 0;
    border: 18px solid transparent;
    border-bottom-width: 0;
}
.chat-body .answer.left .time {
    padding-left: 12px;
    color: #333333;
}
.chat-body .answer .time {
    font-size: 16px;
    line-height: 36px;
    position: relative;
    padding-bottom: 1px;
}
/*RIGHT*/
.chat-body .answer.right {
    padding: 0 58px 0 0;
    text-align: right;
    float: right;
}

.chat-body .answer.right .avatar {
    right: 0;
}
.chat-body .answer.right .avatar .status {
    left: 4px;
}
.chat-body .answer.right .text {
    background: #7266ba;
    color: #ffffff;
    border-radius: 8px 8px 0 8px;
}
.chat-body .answer.right .text:before {
    right: -30px;
    border-left-color: #7266ba;
    border-left-width: 12px;
}
.chat-body .answer.right .time {
    padding-right: 12px;
    color: #333333;
}

/**************ADD FORM ***************/
.answer-add {
    clear: both;
    position: relative;
    /*
    margin: 20px -20px -20px;
    */
    padding: 20px;
    background: #46be8a;
}

.answer-add input {
    border: none;
    background: none;
    display: block;
    width: 100%;
    font-size: 16px;
    line-height: 20px;
    padding: 0;
    color: #ffffff;
}
.chat input {
    -webkit-appearance: none;
    border-radius: 0;
}
.chat-body .answer-add .answer-btn-1 {
    right: 56px;
}
.chat-body .answer-add .answer-btn {
    display: block;
    cursor: pointer;
    width: 36px;
    height: 36px;
    position: absolute;
    top: 50%;
    margin-top: -18px;
}
.chat-body .answer-add .answer-btn-2 {
    right: 20px;
}
*/
.chat input::-webkit-input-placeholder {
   color: #fff;
}

.chat input:-moz-placeholder { /* Firefox 18- */
   color: #fff;
}

.chat input::-moz-placeholder {  /* Firefox 19+ */
   color: #fff;
}

.chat input:-ms-input-placeholder {
   color: #fff;
}
.chat input {
    -webkit-appearance: none;
    border-radius: 0;
}


</style>

<div class="container pt-5 pb-5">
<div class="content container-fluid bootstrap snippets bootdey">
      <div class="row row-broken">
        <div class="col-sm-3 col-xs-12">
          <div class="col-inside-lg decor-default chat" style="overflow: scroll; outline: none;" tabindex="5000">
            <div class="chat-users">
                    <h6>Online</h6>
                <div id="chats-list"></div>
            </div>
          </div>
        </div>
        <div class="col-sm col-xs-12 chat" style="outline: none;" tabindex="5001">
            <div class="chat-header" style="display:flex; flex:wrap;width:100%;padding:20px;padding-top:5px;padding-bottom:10px">
                <h6 class="chat-title" style="flex:1 1 auto;width:1%">Mini Chat</h6>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">O</button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><button class="dropdown-item" type="button" onclick="changeTitle()">Change Chat Title</button></li>
                    </ul>
                </div>
            </div>
            <div class="col-inside-lg decor-default" style="overflow:scroll" id="chat-window">
                <div class="chat-body">
                    <div id="chat-messages"></div>
                </div>
            </div>
            <div class="input-group answer-add">
                <input placeholder="Write a message" id="chatbox" name="chatbox" class="form-control me-2" autocomplete="off" />
                <button class="px-2 me-1"><i class="bi bi-paperclip"></i></button>
                <button class="px-2"><i class="bi bi-send" onclick="sendMessage()"></i></button>
            </div>
        </div>
      </div>
    </div>
 </div>

<template id="tmpl_chat">
    <div class="user">
        <div class="avatar">
        <img src="https://bootdey.com/img/Content/avatar/avatar1.png" alt="User name">
        <div class="status off"></div>
        </div>
        <div class="name">User name</div>
        <div class="mood">User mood</div>
    </div>
</template>

<template id="tmpl_message">
  <div class="answer">
    <div class="avatar">
      <img src="https://bootdey.com/img/Content/avatar/avatar2.png" alt="User name">
      <div class="status off"></div>
    </div>
    <div class="name">Alexander Herthic</div>
    <div class="text">
      It is a long established fact that a reader will be. Thanks Mate!
    </div>
    <div class="time">5 min ago</div>
  </div>
</template>

 {% endblock %}
