{% extends "layout.html" %}

{% block content %}
{% include 'title.html' with title="My Friends" %}

{% if messages %}
<ul class="messages">
    {% for message in messages %}
        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
</ul>
{% endif %}

<form method="post"> {% csrf_token %}
    <table>
        {{ email_invite_form.as_table }}
        <tr><td><input type="submit" value="Invite Friends" /></td></tr>
    </table>
</form>

{% endblock %}
