{% extends "admin/change_form.html" %}
{% load static compress %}

{% block extrahead %}
<script src="https://cdn.tiny.cloud/1/a0lq0ssux6upq2valuacc70rk9sy95v6qx6xvi08e8z3wbhv/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>
{% endblock %}

{% load i18n admin_urls admin_modify static %}
{% block object-tools %}
{% endblock %}

{% block after_related_objects %}
    <script>
      tinymce.init({
        selector: '#id_description',
        height: 500,
      });
    </script>


{% if original.id %}
<input id="fileupload" type="file" name="fileupload" />
<button id="upload-button" onclick="uploadFile()"> Upload </button>

<script>
async function uploadFile() {
    let formData = new FormData();
    formData.append("newbanner", fileupload.files[0]);
    await fetch("{% url 'admin:api_upload_banner' divesiteid=original.id %}", {
      method: "POST",
      body: formData
    });
    alert('The file has been uploaded successfully.');
}
</script>
{% endif %}

{% endblock %}
