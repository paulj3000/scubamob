{% extends "admin/change_form.html" %}
{% load static compress %}

{% block extrahead %}
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js" ></script>
<script src="https://cdn.tiny.cloud/1/a0lq0ssux6upq2valuacc70rk9sy95v6qx6xvi08e8z3wbhv/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
{% endblock %}





{% load i18n admin_urls admin_modify static %}
{% block object-tools %}
{% endblock %}

{% block after_related_objects %}
    <script>

    $.get('/admin/content/image/list', function(done) {
      tinymce.init({
        selector: '#id_content',
        height: 500,
        menubar: 'insert',
        plugins: 'image',
        toolbar: 'image code',
        image_list: done.images,
      });
    });
    </script>
{% endblock %}
