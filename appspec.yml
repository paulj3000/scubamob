version: 0.0
os: linux
files:
  - source: /
    destination: /scuba/apps/scubamob
hooks:
    ApplicationStart:
      -location: scripts/deploy/install_db_updates.sh
      -location: scripts/deploy/install_static.sh
       timeout:300
       #runas: jello
  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 300
      runas: root
