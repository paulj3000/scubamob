version: 0.0
os: linux
files:
  - source: /scuba
    destination: /scuba/apps/scubamob/scuba
  - source: /env
    destination: /scuba/apps/scubamob/env
  - source: /manage.py
    destination: /scuba/apps/scubamob
  - source: /static
    destination: /scuba/apps/scubamob/static
  - source: /templates
    destination: /scuba/apps/scubamob/templates
  - source: /node_modules
    destination: /scuba/apps/scubamob/node_modules
  - source: /requirements.txt
    destination: /scuba/apps/scubamob
file_exists_behavior: OVERWRITE
hooks:
  BeforeInstall:
    - location: scripts/install_server.sh
      timeout: 300
      runas: root
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/install_db_updates.sh
      timeout: 300
      runas: ubuntu
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
