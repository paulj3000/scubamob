version: 0.0
os: linux
files:
  - source: /
    destination: /scuba/apps/scubamob
file_exists_behavior: OVERWRITE
hooks:
  BeforeInstall:
    - location: scripts/install_server.sh
      timeout: 300
      runas: root
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/install_db_updates.sh
      timeout: 300
      runas: ubuntu
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
